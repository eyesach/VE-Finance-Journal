<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deposits — Unit Tests</title>
<style>
  body { font-family: 'DM Sans', system-ui, sans-serif; padding: 24px; background: #f3f4f6; }
  h1 { font-size: 1.4rem; margin-bottom: 16px; }
  .suite { margin-bottom: 20px; }
  .suite h2 { font-size: 1rem; margin-bottom: 8px; border-bottom: 2px solid #3b82f6; padding-bottom: 4px; }
  .test { padding: 6px 12px; margin: 2px 0; border-radius: 4px; font-size: 0.85rem; }
  .test.pass { background: #d1fae5; color: #065f46; }
  .test.fail { background: #fee2e2; color: #991b1b; }
  .summary { margin-top: 20px; padding: 16px; background: #fff; border-radius: 8px; font-weight: 600; }
  .error-detail { font-size: 0.78rem; color: #991b1b; margin-top: 2px; font-family: monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Deposits — Unit Tests</h1>
<div id="results"></div>
<div id="summary" class="summary"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="../js/utils.js"></script>
<script>window.CompanyManager = {};</script>
<script src="../js/database.js"></script>

<script>
let passed = 0, failed = 0;
const resultsEl = document.getElementById('results');

function suite(name) {
  const div = document.createElement('div');
  div.className = 'suite';
  div.innerHTML = `<h2>${name}</h2>`;
  resultsEl.appendChild(div);
  return div;
}
function test(suiteEl, name, fn) {
  const div = document.createElement('div');
  div.className = 'test';
  try { fn(); div.className = 'test pass'; div.textContent = '✔ ' + name; passed++; }
  catch (e) { div.className = 'test fail'; div.innerHTML = '✘ ' + name + `<div class="error-detail">${e.message || e}</div>`; failed++; }
  suiteEl.appendChild(div);
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg) { if (a !== b) throw new Error((msg || 'Not equal') + `: got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`); }
function assertClose(a, b, eps, msg) { if (Math.abs(a - b) > (eps === undefined ? 0.005 : eps)) throw new Error((msg || 'Not close') + `: got ${a}, expected ${b}`); }
function assertThrows(fn, msgPart) {
  let threw = false;
  try { fn(); } catch (e) { threw = true; if (msgPart && !String(e.message).includes(msgPart)) throw new Error(`Threw "${e.message}", expected to include "${msgPart}"`); }
  if (!threw) throw new Error('Expected to throw');
}

function reset() { Database.db = new Database.SQL.Database(); Database.createSchema(); return Database; }
function rows(sql, params) { const r = Database.db.exec(sql, params || []); return r.length ? Database.rowsToObjects(r[0]) : []; }
function txOf(type, depId) {
  return depId === undefined
    ? rows('SELECT * FROM transactions WHERE source_type = ?', [type])
    : rows('SELECT * FROM transactions WHERE source_type = ? AND source_id = ?', [type, depId]);
}
function catOf(tx) { return rows('SELECT * FROM categories WHERE id = ?', [tx.category_id])[0]; }
const LEASE = { name: 'Lease', amount: 2000, paid_date: '2026-03-01', expected_refund_date: '2028-02-28' };

(async () => {
  Database.SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
  Database.autoSave = () => {};

  // ===================== Task 1 =====================
  const s1 = suite('Deposits CRUD & entries');

  test(s1, 'addDeposit creates paid deposit_payment in hidden Security Deposits category', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    const t = txOf('deposit_payment', id);
    assertEqual(t.length, 1, 'payment rows');
    assertEqual(t[0].transaction_type, 'payable');
    assertEqual(t[0].status, 'paid');
    assertEqual(t[0].amount, 2000);
    assertEqual(t[0].month_paid, '2026-03');
    assertEqual(t[0].month_due, '2026-03');
    assertEqual(t[0].item_description, 'Deposit: Lease');
    const c = catOf(t[0]);
    assertEqual(c.name, 'Security Deposits');
    assertEqual(c.show_on_pl, 1);
    assertEqual(Database.getDeposits().length, 1);
    assertEqual(Database.getDepositById(id).name, 'Lease');
  });

  test(s1, 'addDeposit with createEntry=false creates no transaction', () => {
    reset();
    Database.addDeposit({ ...LEASE, createEntry: false });
    assertEqual(rows('SELECT * FROM transactions').length, 0);
  });

  test(s1, 'updateDeposit syncs payment entry', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    Database.updateDeposit(id, { ...LEASE, amount: 2500, paid_date: '2026-04-02', name: 'Office' });
    const t = txOf('deposit_payment', id)[0];
    assertEqual(t.amount, 2500);
    assertEqual(t.month_paid, '2026-04');
    assertEqual(t.entry_date, '2026-04-02');
    assertEqual(t.item_description, 'Deposit: Office');
    assertEqual(Database.getDepositById(id).amount, 2500);
  });

  test(s1, 'full refund creates received receivable for full amount, no withheld', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 2000 });
    const r = txOf('deposit_refund', id);
    assertEqual(r.length, 1);
    assertEqual(r[0].transaction_type, 'receivable');
    assertEqual(r[0].status, 'received');
    assertEqual(r[0].amount, 2000);
    assertEqual(r[0].month_paid, '2027-06');
    assertEqual(catOf(r[0]).name, 'Security Deposits');
    assertEqual(txOf('deposit_withheld', id).length, 0);
    const d = Database.getDepositById(id);
    assertEqual(d.refunded_amount, 2000);
    assertEqual(d.refunded_date, '2027-06-15');
  });

  test(s1, 'partial refund creates withheld expense in Deposit Forfeitures', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 1700 });
    assertEqual(txOf('deposit_refund', id)[0].amount, 2000, 'refund is full amount');
    const w = txOf('deposit_withheld', id);
    assertEqual(w.length, 1);
    assertEqual(w[0].amount, 300);
    assertEqual(w[0].status, 'paid');
    assertEqual(w[0].transaction_type, 'payable');
    assertEqual(w[0].month_paid, '2027-06');
    const c = catOf(w[0]);
    assertEqual(c.name, 'Deposit Forfeitures');
    assertEqual(c.show_on_pl, 0);
  });

  test(s1, 'partial refund uses a chosen withheld category', () => {
    reset();
    const catId = Database.addCategory('Repairs', false, null, 'payable');
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 1500, withheld_category_id: catId });
    assertEqual(txOf('deposit_withheld', id)[0].category_id, catId);
  });

  test(s1, 'refund rejects date before paid_date and amount out of range', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    assertThrows(() => Database.markDepositRefunded(id, { refund_date: '2026-02-28', refunded_amount: 2000 }));
    assertThrows(() => Database.markDepositRefunded(id, { refund_date: '2027-01-01', refunded_amount: -1 }));
    assertThrows(() => Database.markDepositRefunded(id, { refund_date: '2027-01-01', refunded_amount: 2000.01 }));
    assertEqual(rows("SELECT * FROM transactions WHERE source_type IN ('deposit_refund','deposit_withheld')").length, 0);
  });

  test(s1, "updateDeposit on refunded deposit with amount change throws 'Undo refund first'", () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 2000 });
    assertThrows(() => Database.updateDeposit(id, { ...LEASE, amount: 2100 }), 'Undo refund first');
    assertThrows(() => Database.updateDeposit(id, { ...LEASE, paid_date: '2026-04-01' }), 'Undo refund first');
    Database.updateDeposit(id, { ...LEASE, name: 'Renamed' });
    assertEqual(Database.getDepositById(id).name, 'Renamed');
    assertEqual(Database.getDepositById(id).refunded_amount, 2000, 'refund kept');
  });

  test(s1, 'undoDepositRefund removes refund rows and clears fields', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 1700 });
    Database.undoDepositRefund(id);
    assertEqual(txOf('deposit_refund', id).length, 0);
    assertEqual(txOf('deposit_withheld', id).length, 0);
    assertEqual(txOf('deposit_payment', id).length, 1, 'payment kept');
    const d = Database.getDepositById(id);
    assertEqual(d.refunded_date, null);
    assertEqual(d.refunded_amount, null);
  });

  test(s1, 'refund + undo on deposit without payment entry works, never creates deposit_payment', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE, createEntry: false });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 2000 });
    Database.undoDepositRefund(id);
    Database.updateDeposit(id, { ...LEASE, amount: 1800 });
    assertEqual(txOf('deposit_payment').length, 0);
    assertEqual(rows('SELECT * FROM transactions').length, 0);
  });

  test(s1, 'deleteDeposit removes row and all three entry types', () => {
    reset();
    const keep = Database.addDeposit({ ...LEASE, name: 'Other' });
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 1700 });
    Database.deleteDeposit(id);
    assertEqual(Database.getDepositById(id), null);
    assertEqual(rows('SELECT * FROM transactions WHERE source_id = ? AND source_type LIKE ?', [id, 'deposit_%']).length, 0);
    assertEqual(txOf('deposit_payment', keep).length, 1, 'other deposit untouched');
  });

  test(s1, 'snapshot/restore round-trips a refunded deposit', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 1700 });
    const before = rows("SELECT id FROM transactions WHERE source_id = ? AND source_type LIKE 'deposit_%' ORDER BY id", [id]).map(r => r.id);
    const snap = Database.snapshotDeposit(id);
    assertEqual(snap.id, id);
    Database.deleteDeposit(id);
    Database.restoreDeposit(snap);
    const d = Database.getDepositById(id);
    assert(d, 'deposit back');
    assertEqual(d.refunded_amount, 1700);
    const after = rows("SELECT id FROM transactions WHERE source_id = ? AND source_type LIKE 'deposit_%' ORDER BY id", [id]).map(r => r.id);
    assertEqual(JSON.stringify(after), JSON.stringify(before));
  });

  test(s1, 'restoreDeposit of an empty (pre-add) snapshot deletes the deposit', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    Database.restoreDeposit({ id, deposit: null, transactions: [] });
    assertEqual(Database.getDepositById(id), null);
    assertEqual(txOf('deposit_payment', id).length, 0);
  });

  // ===================== Task 2 =====================
  const s2 = suite('Deposit classification');
  const DEP = { paid_date: '2026-03-01', expected_refund_date: '2028-02-28', refunded_date: null };
  const cls = (d, m) => JSON.stringify(Utils.classifyDeposit(d, m));
  const J = o => JSON.stringify(o);

  test(s2, 'before paid month: not held', () => {
    assertEqual(cls(DEP, '2026-02'), J({ held: false, bucket: null, overdue: false }));
  });
  test(s2, 'paid month, refund >12 months out: held long-term', () => {
    assertEqual(cls(DEP, '2026-03'), J({ held: true, bucket: 'longterm', overdue: false }));
  });
  test(s2, 'exactly 12 months out: current', () => {
    assertEqual(cls(DEP, '2027-02'), J({ held: true, bucket: 'current', overdue: false }));
  });
  test(s2, '13 months out: long-term', () => {
    assertEqual(cls(DEP, '2027-01'), J({ held: true, bucket: 'longterm', overdue: false }));
  });
  test(s2, 'expected date passed, not refunded: current and overdue', () => {
    assertEqual(cls(DEP, '2028-05'), J({ held: true, bucket: 'current', overdue: true }));
  });
  test(s2, 'refunded: held through month before refund, gone in refund month', () => {
    const r = { ...DEP, refunded_date: '2028-03-10' };
    assertEqual(Utils.classifyDeposit(r, '2028-02').held, true);
    assertEqual(cls(r, '2028-03'), J({ held: false, bucket: null, overdue: false }));
  });
  test(s2, 'no expected refund date: long-term', () => {
    assertEqual(cls({ ...DEP, expected_refund_date: null }, '2026-03'), J({ held: true, bucket: 'longterm', overdue: false }));
  });
  test(s2, 'year rollover: Nov 2026 + 12 = Nov 2027 boundary', () => {
    const d = { ...DEP, expected_refund_date: '2027-11-30' };
    assertEqual(Utils.classifyDeposit(d, '2026-11').bucket, 'current');
    assertEqual(Utils.classifyDeposit(d, '2026-10').bucket, 'longterm');
  });

  // ===================== Task 3 =====================
  const s3 = suite('Asset totals & balance');
  function seedBase() {
    reset();
    Database.setPLTaxMode('passthrough');
    // isSales = 12th arg → counts as revenue in retained earnings
    const sales = Database.addCategory('Sales', false, null, 'receivable', null, false, false, false, false, false, null, true);
    Database.addTransaction({ entry_date: '2026-01-10', category_id: sales, item_description: 'Sale', amount: 10000,
      transaction_type: 'receivable', status: 'received', month_due: '2026-01', month_paid: '2026-01' });
  }
  const T = m => Database.getAssetTotalsAsOf(m);
  function bsDiff(m) {
    const liabEq = Database.getAccountsPayableAsOf(m) + Database.getSalesTaxPayableAsOf(m) + Database.getRetainedEarningsAsOf(m, 'passthrough');
    return Math.round((T(m).totalAssets - liabEq) * 100) / 100;
  }
  const allDeposits = t => t.currentDeposits + t.longTermDeposits;

  test(s3, 'deposit paid 2026-03: absent in 2026-02, present in 2026-03, bsDiff 0 in both', () => {
    seedBase();
    Database.addDeposit({ ...LEASE });
    assertEqual(allDeposits(T('2026-02')), 0);
    assertEqual(T('2026-03').longTermDeposits, 2000);
    assertEqual(T('2026-03').longTermDepositDetails.length, 1);
    assertEqual(bsDiff('2026-02'), 0, 'Feb');
    assertEqual(bsDiff('2026-03'), 0, 'Mar');
  });

  test(s3, 'classification moves deposit between current and long-term, totalAssets unchanged', () => {
    seedBase();
    Database.addDeposit({ ...LEASE });
    const jan = T('2027-01'), feb = T('2027-02');
    assertEqual(jan.longTermDeposits, 2000); assertEqual(jan.currentDeposits, 0);
    assertEqual(feb.currentDeposits, 2000); assertEqual(feb.longTermDeposits, 0);
    assertEqual(feb.currentDepositDetails.length, 1);
    assertEqual(jan.totalAssets, feb.totalAssets);
    assertEqual(jan.totalOtherAssets, 2000);
    assertEqual(feb.totalCurrentAssets, feb.cash + feb.ar + 2000);
  });

  test(s3, 'full refund 2028-03: deposit gone, cash +2000 vs 2028-02, bsDiff 0', () => {
    seedBase();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2028-03-10', refunded_amount: 2000 });
    assertEqual(allDeposits(T('2028-03')), 0);
    assertEqual(T('2028-03').cash - T('2028-02').cash, 2000);
    assertEqual(bsDiff('2028-02'), 0); assertEqual(bsDiff('2028-03'), 0);
  });

  test(s3, 'partial refund 1700/2000: cash +1700, bsDiff 0', () => {
    seedBase();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2028-03-10', refunded_amount: 1700 });
    assertEqual(T('2028-03').cash - T('2028-02').cash, 1700);
    assertEqual(bsDiff('2028-03'), 0);
  });

  test(s3, 'refund in same month as payment: bsDiff 0, cash net change -300 for 1700/2000', () => {
    seedBase();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2026-03-20', refunded_amount: 1700 });
    assertEqual(allDeposits(T('2026-03')), 0);
    assertEqual(T('2026-03').cash - T('2026-02').cash, -300);
    assertEqual(bsDiff('2026-03'), 0);
  });

  test(s3, 'fixed asset purchased 2026-06 excluded in 2026-05 (cost and accum depr), included in 2026-06', () => {
    seedBase();
    Database.addFixedAsset('Laptop', 1200, 12, '2026-06-01', 0, 'straight_line', '2026-06-01', true);
    const may = T('2026-05'), jun = T('2026-06');
    assertEqual(may.totalFixedAssetCost, 0); assertEqual(may.totalAccumDepr, 0); assertEqual(may.fixedAssetDetails.length, 0);
    assertEqual(jun.totalFixedAssetCost, 1200);
    assertEqual(jun.fixedAssetDetails.length, 1);
    assertClose(jun.netFixedAssets, 1200 - jun.totalAccumDepr);
    assertEqual(may.totalAssets, may.cash + may.ar);
  });

  test(s3, 'totals identities hold', () => {
    seedBase();
    Database.addDeposit({ ...LEASE });
    Database.addDeposit({ ...LEASE, name: 'Utility', amount: 300, expected_refund_date: '2026-12-31' });
    Database.addFixedAsset('Desk', 600, 24, '2026-02-01', 0, 'straight_line', '2026-02-01', true);
    const t = T('2026-06');
    assertEqual(t.currentDeposits, 300); assertEqual(t.longTermDeposits, 2000);
    assertClose(t.totalCurrentAssets, t.cash + t.ar + t.currentDeposits);
    assertEqual(t.totalOtherAssets, t.longTermDeposits);
    assertClose(t.totalAssets, t.totalCurrentAssets + t.netFixedAssets + t.totalOtherAssets);
  });

  test(s3, 'overdue flag carried on current deposit details', () => {
    seedBase();
    Database.addDeposit({ ...LEASE });
    assertEqual(T('2028-05').currentDepositDetails[0].overdue, true);
  });

  // ===================== Task 6 =====================
  const s6 = suite('Housekeeping');
  test(s6, "resetTabData('assets') clears deposits and their entries", () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 1700 });
    const other = Database.addCategory('Rent', false, null, 'payable');
    Database.addTransaction({ entry_date: '2026-01-01', category_id: other, amount: 50, transaction_type: 'payable', status: 'paid', month_due: '2026-01', month_paid: '2026-01' });
    Database.resetTabData('assets');
    assertEqual(Database.getDeposits().length, 0);
    assertEqual(rows("SELECT * FROM transactions WHERE source_type LIKE 'deposit_%'").length, 0);
    assertEqual(rows('SELECT * FROM transactions').length, 1, 'unrelated entry kept');
  });

  // ===================== Final review fixes =====================
  const sf = suite('Final review fixes');
  test(sf, 'fixed asset with depreciation start before purchase: BS balances in the gap months', () => {
    seedBase();
    const cat = Database.addCategory('Asset Purchases', false, null, 'payable', null, true);
    const aid = Database.addFixedAsset('Van', 1200, 12, '2026-06-15', 0, 'straight_line', '2026-03-01', true);
    // Mirrors _autoCreateAssetTransaction: due at dep-start month, paid at purchase month
    Database.addTransaction({ entry_date: '2026-06-15', category_id: cat, item_description: 'Purchase: Van', amount: 1200,
      transaction_type: 'payable', status: 'paid', month_due: '2026-03', month_paid: '2026-06', source_type: 'asset_purchase', source_id: aid });
    assertEqual(bsDiff('2026-04'), 0, 'Apr (between dep start and purchase)');
    assertEqual(bsDiff('2026-07'), 0, 'Jul');
    assertEqual(T('2026-02').totalFixedAssetCost, 0, 'not counted before dep start');
  });
  test(sf, 'depositStatus: future-dated refund is "scheduled", not refunded', () => {
    const d = { paid_date: '2026-03-01', expected_refund_date: '2028-02-28', refunded_date: '2027-01-10' };
    assertEqual(Utils.depositStatus(d, '2026-11'), 'scheduled');
    assertEqual(Utils.depositStatus(d, '2027-01'), 'refunded');
  });
  test(sf, 'depositStatus: other states', () => {
    const d = { paid_date: '2026-03-01', expected_refund_date: '2027-08-31', refunded_date: null };
    assertEqual(Utils.depositStatus(d, '2026-02'), 'upcoming');
    assertEqual(Utils.depositStatus(d, '2026-07'), 'longterm');
    assertEqual(Utils.depositStatus(d, '2026-11'), 'current');
    assertEqual(Utils.depositStatus(d, '2027-10'), 'overdue');
  });

  // ===================== Minor fixes =====================
  const sm = suite('Minor fixes');
  test(sm, 'renaming a refunded deposit renames refund and withheld journal entries', () => {
    reset();
    const id = Database.addDeposit({ ...LEASE });
    Database.markDepositRefunded(id, { refund_date: '2027-06-15', refunded_amount: 1700 });
    Database.updateDeposit(id, { ...LEASE, name: 'HQ lease' });
    assertEqual(txOf('deposit_payment', id)[0].item_description, 'Deposit: HQ lease');
    assertEqual(txOf('deposit_refund', id)[0].item_description, 'Deposit refund: HQ lease');
    assertEqual(txOf('deposit_withheld', id)[0].item_description, 'Deposit withheld: HQ lease');
  });

  test(sm, 'withheld category options: only plain P&L expense categories', () => {
    reset();
    const A = (name, ...flags) => Database.addCategory(name, ...flags);
    // addCategory(name, isMonthly, defaultAmount, defaultType, folderId, showOnPl(hide), isCogs, isDepreciation, isSalesTax, isB2b, defaultStatus, isSales, isInventoryCost, isShipping)
    A('Repairs', false, null, 'payable');
    A('Rent', false, null, null);
    A('Hidden', false, null, 'payable', null, true);
    A('Deprec', false, null, 'payable', null, false, false, true);
    A('COGS', false, null, 'payable', null, false, true);
    A('SalesTax', false, null, 'payable', null, false, false, false, true);
    A('B2B', false, null, 'receivable', null, false, false, false, false, true);
    A('Sales', false, null, 'receivable', null, false, false, false, false, false, null, true);
    A('InvCost', false, null, 'payable', null, false, false, false, false, false, null, false, true);
    A('Ship', false, null, 'payable', null, false, false, false, false, false, null, false, false, true);
    A('Income', false, null, 'receivable');
    A('Deposit Forfeitures', false, null, 'payable');
    // A fresh DB also has seeded defaults (General Expense, Utilities, ...), so check membership
    const names = Database.getWithheldCategoryOptions().map(c => c.name);
    ['Repairs', 'Rent'].forEach(n => assert(names.includes(n), `${n} should be offered`));
    ['Hidden', 'Deprec', 'COGS', 'SalesTax', 'B2B', 'Sales', 'InvCost', 'Ship', 'Income', 'Deposit Forfeitures']
      .forEach(n => assert(!names.includes(n), `${n} should not be offered`));
  });

  // @@NEXT_SUITE@@

  document.getElementById('summary').textContent = `${passed}/${passed + failed} tests passed, ${failed} failed`;
})().catch(e => { document.getElementById('summary').textContent = 'CRASH: ' + e.message; });
</script>
</body>
</html>
