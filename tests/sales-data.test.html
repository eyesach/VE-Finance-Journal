<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sales Data — Unit Tests</title>
<style>
  body { font-family: 'DM Sans', system-ui, sans-serif; padding: 24px; background: #f3f4f6; }
  h1 { font-size: 1.4rem; margin-bottom: 16px; }
  .suite { margin-bottom: 20px; }
  .suite h2 { font-size: 1rem; margin-bottom: 8px; border-bottom: 2px solid #3b82f6; padding-bottom: 4px; }
  .test { padding: 6px 12px; margin: 2px 0; border-radius: 4px; font-size: 0.85rem; }
  .test.pass { background: #d1fae5; color: #065f46; }
  .test.fail { background: #fee2e2; color: #991b1b; }
  .summary { margin-top: 20px; padding: 16px; background: #fff; border-radius: 8px; font-weight: 600; }
  .error-detail { font-size: 0.78rem; color: #991b1b; margin-top: 2px; font-family: monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Sales Data — Unit Tests</h1>
<div id="results"></div>
<div id="summary" class="summary"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="../js/utils.js"></script>
<script>window.CompanyManager = {};</script>
<script src="../js/database.js"></script>

<script>
let passed = 0, failed = 0;
const resultsEl = document.getElementById('results');

function suite(name) {
  const div = document.createElement('div');
  div.className = 'suite';
  div.innerHTML = `<h2>${name}</h2>`;
  resultsEl.appendChild(div);
  return div;
}
function test(suiteEl, name, fn) {
  const div = document.createElement('div');
  div.className = 'test';
  try { fn(); div.className = 'test pass'; div.textContent = '✔ ' + name; passed++; }
  catch (e) { div.className = 'test fail'; div.innerHTML = '✘ ' + name + `<div class="error-detail">${e.message || e}</div>`; failed++; }
  suiteEl.appendChild(div);
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg) { if (a !== b) throw new Error((msg || 'Not equal') + `: got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`); }
function assertClose(a, b, eps, msg) { if (Math.abs(a - b) > (eps === undefined ? 0.005 : eps)) throw new Error((msg || 'Not close') + `: got ${a}, expected ${b}`); }

async function freshDb() {
  if (!Database.SQL) Database.SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
  Database.autoSave = () => {};
  Database.db = new Database.SQL.Database();
  Database.createSchema();
  return Database;
}

(async () => {
  await freshDb();

  const s1 = suite('Ignored VE items');
  test(s1, 'ignored: add then list', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    d.addIgnoredItem('TEST ITEM', 1);
    const items = d.getIgnoredItems();
    assertEqual(items.length, 1);
    assertEqual(items[0].name, 'TEST ITEM');
    assertEqual(items[0].price, 1);
  });
  test(s1, 'ignored: duplicate add is ignored', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    d.addIgnoredItem('A', 1); d.addIgnoredItem('A', 1);
    assertEqual(d.getIgnoredItems().length, 1);
  });
  test(s1, 'ignored: price rounding matches', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    d.addIgnoredItem('A', 2.005);
    d.removeIgnoredItem('A', 2.01);
    assertEqual(d.getIgnoredItems().length, 0);
  });
  test(s1, 'ignored: remove', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    d.addIgnoredItem('A', 5); d.removeIgnoredItem('A', 5);
    assertEqual(d.getIgnoredItems().length, 0);
  });

  const s2 = suite('Single mapping add');
  test(s2, 'mapping: add single keeps existing', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    d.addProduct('P', '', 10, 0, 4, null);
    d.setMappingsForProduct(1, [{ name: 'X', price: 10 }]);
    d.addProductVeMapping(1, 'Y', 10);
    const r = d.db.exec('SELECT COUNT(*) FROM product_ve_mappings WHERE product_id=1');
    assertEqual(r[0].values[0][0], 2);
  });

  const s3 = suite('Migration');
  test(s3, 'migration: table exists after migrateSchema on old db', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    d.db.run('DROP TABLE ve_ignored_items');
    d.migrateSchema();
    const r = d.db.exec("SELECT name FROM sqlite_master WHERE name='ve_ignored_items'");
    assertEqual(r.length, 1);
  });

  function seedSales(d) {
    d.db = new d.SQL.Database(); d.createSchema();
    d.addProduct('Bundle v1', '', 25, 0, 13.75, null);
    d.addProduct('Sticker', '', 6, 0, 1.2, null);
    d.addProduct('Sticker Rebrand', '', 6, 0, 1.2, null);
    d.addProductVeMapping(1, 'Bundle', 25);
    d.addProductVeMapping(2, 'Sticker', 6);
    d.addProductVeMapping(3, 'Sticker', 6);
    const sale = 'INSERT INTO ve_sales (transaction_no, date, billing_name, description, subtotal, tax, shipping, discount, total, source, event_id) VALUES (?,?,?,?,?,?,?,?,?,?,?)';
    d.db.run(sale, ['T1', '2026-08-03', 'A', '', 56, 0, 6, 5.6, 56.4, 'online', null]);
    d.db.run(sale, ['T2', '2026-09-10', 'B', '', 12, 0, 0, 0, 12, 'tradeshow', 7]);
    d.db.run(sale, ['T3', '2026-09-12', 'C', '', 0, 0, 4, 2, 2, 'online', null]);
    const item = 'INSERT INTO ve_sale_items (transaction_no, name, product_number, price, quantity, taxable, amount, inferred) VALUES (?,?,?,?,?,?,?,?)';
    d.db.run(item, ['T1', 'Bundle', '', 25, 2, 0, 50, 0]);
    d.db.run(item, ['T1', 'Sticker', '', 6, 1, 0, 6, 0]);
    d.db.run(item, ['T2', 'Sticker', '', 6, 1, 0, 6, 0]);
    d.db.run(item, ['T2', 'TEST ITEM', '', 1, 6, 0, 6, 0]);
    d.db.run(item, ['T3', 'Mystery', '', 0, 1, 0, 0, 0]);
    d.addIgnoredItem('TEST ITEM', 1);
  }
  const find = (lines, tn, name) => lines.find(l => l.transaction_no === tn && l.name === name);

  const s4 = suite('Sales data lines');
  test(s4, 'lines: all filters empty returns 5 lines', () => {
    seedSales(Database);
    assertEqual(Database.getSalesDataLines({}).length, 5);
  });
  test(s4, 'lines: discount allocated proportionally', () => {
    seedSales(Database);
    const l = Database.getSalesDataLines({});
    assertClose(find(l, 'T1', 'Bundle').discount, 5.0);
    assertClose(find(l, 'T1', 'Sticker').discount, 0.6);
  });
  test(s4, 'lines: zero-subtotal order allocates no discount', () => {
    seedSales(Database);
    assertEqual(find(Database.getSalesDataLines({}), 'T3', 'Mystery').discount, 0);
  });
  test(s4, 'lines: multi-link product_ids ascending', () => {
    seedSales(Database);
    assertEqual(JSON.stringify(find(Database.getSalesDataLines({}), 'T1', 'Sticker').product_ids), '[2,3]');
  });
  test(s4, 'lines: unlinked has empty product_ids', () => {
    seedSales(Database);
    assertEqual(find(Database.getSalesDataLines({}), 'T3', 'Mystery').product_ids.length, 0);
  });
  test(s4, 'lines: ignored flag', () => {
    seedSales(Database);
    const l = Database.getSalesDataLines({});
    assertEqual(find(l, 'T2', 'TEST ITEM').ignored, true);
    assertEqual(find(l, 'T1', 'Bundle').ignored, false);
    assertEqual(find(l, 'T3', 'Mystery').ignored, false);
  });
  test(s4, 'lines: numeric fields are numbers', () => {
    seedSales(Database);
    const l = find(Database.getSalesDataLines({}), 'T1', 'Bundle');
    assertEqual(typeof l.price, 'number'); assertEqual(typeof l.quantity, 'number');
    assertEqual(typeof l.amount, 'number'); assertEqual(typeof l.discount, 'number');
  });
  test(s4, 'lines: source filter', () => {
    seedSales(Database);
    assertEqual(Database.getSalesDataLines({ source: 'online' }).length, 3);
    assertEqual(Database.getSalesDataLines({ source: 'both' }).length, 5);
  });
  test(s4, 'lines: date filter', () => {
    seedSales(Database);
    assertEqual(Database.getSalesDataLines({ from: '2026-09-01', to: '2026-09-30' }).length, 3);
  });
  test(s4, 'lines: event filter id', () => {
    seedSales(Database);
    assertEqual(Database.getSalesDataLines({ event: '7' }).length, 2);
    assertEqual(Database.getSalesDataLines({ event: '__unassigned__' }).length, 3);
  });
  test(s4, 'lines: month field', () => {
    seedSales(Database);
    const l = Database.getSalesDataLines({}).filter(x => x.transaction_no === 'T2');
    assert(l.length === 2 && l.every(x => x.month === '2026-09'));
  });
  test(s4, 'lines: empty result is []', () => {
    seedSales(Database);
    assertEqual(Database.getSalesDataLines({ source: 'nope' }).length, 0);
  });
  test(s4, 'shipping: summary', () => {
    seedSales(Database);
    const all = Database.getShippingSummary({});
    assertEqual(all.total, 10); assertEqual(all.orders, 2);
    const on = Database.getShippingSummary({ source: 'online', from: '2026-08-01', to: '2026-08-31' });
    assertEqual(on.total, 6); assertEqual(on.orders, 1);
  });

  const s5 = suite('computeSalesData');
  const L = (o) => Object.assign({ transaction_no: 'T' + Math.random(), date: '2026-09-05', month: '2026-09', name: 'X', price: 1, quantity: 1, amount: 1, discount: 0, product_ids: [], ignored: false }, o);
  const P = (id, name, cogs) => ({ id, name, cogs });
  test(s5, 'getLastMonthsRange: last 3', () => {
    assertEqual(JSON.stringify(Utils.getLastMonthsRange(3, new Date(2026, 10, 7))), JSON.stringify({ from: '2026-08-01', to: '2026-10-31' }));
  });
  test(s5, 'getLastMonthsRange: january rollover', () => {
    assertEqual(JSON.stringify(Utils.getLastMonthsRange(1, new Date(2027, 0, 15))), JSON.stringify({ from: '2026-12-01', to: '2026-12-31' }));
  });
  test(s5, 'weighted: two products', () => {
    const r = Utils.computeSalesData([
      L({ product_ids: [1], quantity: 168, amount: 4032, price: 24 }),
      L({ product_ids: [2], quantity: 121, amount: 726, price: 6 })
    ], [P(1, 'A', 9.5), P(2, 'B', 1.2)]);
    assertEqual(r.weighted.units, 289);
    assertClose(r.weighted.avgPrice, 16.46, 0.01);
    assertClose(r.weighted.avgCogs, 6.02, 0.01);
    assertClose(r.weighted.cm, 10.44, 0.01);
    assertEqual(r.weighted.productCount, 2);
    assertEqual(r.byProduct[0].productId, 1);
  });
  test(s5, 'discount reduces revenue', () => {
    const r = Utils.computeSalesData([L({ product_ids: [1], quantity: 2, amount: 50, discount: 5 })], [P(1, 'A', 10)]);
    assertClose(r.byProduct[0].avgPrice, 22.5, 0.001);
    assertClose(r.byProduct[0].margin, 12.5, 0.001);
    assertClose(r.byProduct[0].netRevenue, 45, 0.001);
  });
  test(s5, 'multi-link: counted once, lowest id', () => {
    const r = Utils.computeSalesData([L({ product_ids: [3, 2], quantity: 4, amount: 40 })],
      [P(2, 'Sticker', 1.2), P(3, 'Sticker Rebrand', 1.2)]);
    assertEqual(r.byProduct.length, 1);
    assertEqual(r.byProduct[0].productId, 2);
    assertEqual(r.byProduct[0].units, 4);
    assertEqual(JSON.stringify(r.byProduct[0].alsoNames), JSON.stringify(['Sticker Rebrand']));
    assertEqual(r.byProduct[0].cogsConflict, null);
  });
  test(s5, 'multi-link: conflicting cogs flagged', () => {
    const r = Utils.computeSalesData([L({ product_ids: [2, 3], quantity: 4, amount: 40 })],
      [P(2, 'Sticker', 1.2), P(3, 'Sticker Rebrand', 1.5)]);
    assertEqual(r.byProduct[0].cogs, 1.2);
    assertEqual(JSON.stringify(r.byProduct[0].cogsConflict), JSON.stringify([1.2, 1.5]));
  });
  test(s5, 'ignored wins over linked', () => {
    const r = Utils.computeSalesData([L({ product_ids: [1], amount: 30, name: 'Z', ignored: true })], [P(1, 'A', 1)]);
    assertEqual(r.byProduct.length, 0);
    assertEqual(r.ignored.length, 1);
    assertEqual(r.eligible.amount, 0);
  });
  test(s5, 'linkedPct', () => {
    const r = Utils.computeSalesData([
      L({ product_ids: [1], amount: 90 }),
      L({ amount: 10, name: 'U' }),
      L({ amount: 50, name: 'I', ignored: true })
    ], [P(1, 'A', 1)]);
    assertEqual(r.linkedPct, 90);
    assertEqual(r.linked.amount, 90); assertEqual(r.eligible.amount, 100);
  });
  test(s5, 'unknown product ids treated as unlinked', () => {
    const r = Utils.computeSalesData([L({ product_ids: [99], amount: 10, name: 'U' })], [P(1, 'A', 1)]);
    assertEqual(r.unlinked.length, 1); assertEqual(r.weighted, null);
  });
  test(s5, 'empty linked set returns nulls', () => {
    const a = Utils.computeSalesData([L({ amount: 10, name: 'U' })], []);
    assertEqual(a.weighted, null);
    const b = Utils.computeSalesData([L({ amount: 10, ignored: true })], []);
    assertEqual(b.linkedPct, null);
  });
  test(s5, 'missing cogs flagged', () => {
    const r = Utils.computeSalesData([L({ product_ids: [1], quantity: 2, amount: 20 })], [P(1, 'A', 0)]);
    assertEqual(r.byProduct[0].missingCogs, true);
    assertEqual(r.byProduct[0].units, 2);
  });
  test(s5, 'item groups', () => {
    const r = Utils.computeSalesData([
      L({ transaction_no: 'A', name: 'Mystery', price: 0, amount: 0, date: '2026-09-12' }),
      L({ transaction_no: 'B', name: 'Mystery', price: 0, amount: 0, date: '2026-09-01' })
    ], []);
    const g = r.unlinked[0];
    assertEqual(g.qty, 2); assertEqual(g.orders, 2);
    assertEqual(g.firstDate, '2026-09-01'); assertEqual(g.lastDate, '2026-09-12');
  });
  test(s5, 'bestSellers top 3 per metric', () => {
    // units: A5 B4 C3 D2 ; revenue: D200 C150 B40 A10 (differs)
    const r = Utils.computeSalesData([
      L({ product_ids: [1], quantity: 5, amount: 10 }),
      L({ product_ids: [2], quantity: 4, amount: 40 }),
      L({ product_ids: [3], quantity: 3, amount: 150 }),
      L({ product_ids: [4], quantity: 2, amount: 200 })
    ], [P(1, 'A', 0), P(2, 'B', 0), P(3, 'C', 0), P(4, 'D', 0)]);
    const b = r.bestSellers['2026-09'];
    assertEqual(b.units.length, 3); assertEqual(b.revenue.length, 3); assertEqual(b.margin.length, 3);
    assertEqual(JSON.stringify(b.units.map(x => x.productId)), JSON.stringify([1, 2, 3]));
    assertEqual(JSON.stringify(b.revenue.map(x => x.productId)), JSON.stringify([4, 3, 2]));
    assertEqual(b.revenue[0].value, 200);
  });

  test(s5, 'monthsBetween year boundary, same month, cap', () => {
    assertEqual(JSON.stringify(Utils.monthsBetween('2026-11', '2027-02')), JSON.stringify(['2026-11', '2026-12', '2027-01', '2027-02']));
    assertEqual(JSON.stringify(Utils.monthsBetween('2026-09-15', '2026-09-30')), JSON.stringify(['2026-09']));
    const c = Utils.monthsBetween('2020-01', '2026-12', 36);
    assertEqual(c.length, 36); assertEqual(c[0], '2024-01'); assertEqual(c[35], '2026-12');
    assertEqual(Utils.monthsBetween('2027-02', '2026-11').length, 0);
  });

  document.getElementById('summary').textContent = `${passed}/${passed + failed} tests passed, ${failed} failed`;
})().catch(e => { document.getElementById('summary').textContent = 'CRASH: ' + e.message; });
</script>
</body>
</html>
