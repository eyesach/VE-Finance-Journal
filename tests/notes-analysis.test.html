<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notes & Analysis — Unit Tests</title>
<style>
  body { font-family: 'DM Sans', system-ui, sans-serif; padding: 24px; background: #f3f4f6; }
  h1 { font-size: 1.4rem; margin-bottom: 16px; }
  .suite { margin-bottom: 20px; }
  .suite h2 { font-size: 1rem; margin-bottom: 8px; border-bottom: 2px solid #3b82f6; padding-bottom: 4px; }
  .test { padding: 6px 12px; margin: 2px 0; border-radius: 4px; font-size: 0.85rem; }
  .test.pass { background: #d1fae5; color: #065f46; }
  .test.fail { background: #fee2e2; color: #991b1b; }
  .summary { margin-top: 20px; padding: 16px; background: #fff; border-radius: 8px; font-weight: 600; }
  .error-detail { font-size: 0.78rem; color: #991b1b; margin-top: 2px; font-family: monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Notes & Analysis — Unit Tests</h1>
<div id="results"></div>
<div id="summary" class="summary"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="../js/utils.js"></script>

<script>
let passed = 0, failed = 0;
const resultsEl = document.getElementById('results');

function suite(name) {
  const div = document.createElement('div');
  div.className = 'suite';
  div.innerHTML = `<h2>${name}</h2>`;
  resultsEl.appendChild(div);
  return div;
}
function test(suiteEl, name, fn) {
  const div = document.createElement('div');
  div.className = 'test';
  try { fn(); div.className = 'test pass'; div.textContent = '✔ ' + name; passed++; }
  catch (e) { div.className = 'test fail'; div.innerHTML = '✘ ' + name + `<div class="error-detail">${e.message || e}</div>`; failed++; }
  suiteEl.appendChild(div);
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEq(a, b, msg) { if (a !== b) throw new Error((msg || 'Not equal') + `: got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`); }

// === Markdown parser tests ===
const s1 = suite('renderMarkdownSafe');
test(s1, 'escapes < > & " before transforms', () => {
  const out = Utils.renderMarkdownSafe('<script>alert(1)</script>');
  assert(!out.includes('<script>'), 'must not contain raw <script>');
  assert(out.includes('&lt;script&gt;'), 'must contain escaped tag');
});
test(s1, 'bold transform applies after escaping', () => {
  assertEq(Utils.renderMarkdownSafe('**hello**'), '<strong>hello</strong>');
});
test(s1, 'italic transform applies', () => {
  assertEq(Utils.renderMarkdownSafe('*hi*'), '<em>hi</em>');
});
test(s1, 'list lines transform', () => {
  const out = Utils.renderMarkdownSafe('- one\n- two');
  assert(out.includes('<ul>'), 'has ul');
  assert(out.includes('<li>one</li>'), 'has first li');
  assert(out.includes('<li>two</li>'), 'has second li');
});
test(s1, 'mixed: escape + bold + list', () => {
  const out = Utils.renderMarkdownSafe('**bold** with <b>raw</b>\n- item');
  assert(out.includes('<strong>bold</strong>'), 'bold transformed');
  assert(out.includes('&lt;b&gt;raw&lt;/b&gt;'), 'raw HTML escaped');
  assert(out.includes('<li>item</li>'), 'list rendered');
});
test(s1, 'plain text passes through unchanged', () => {
  assertEq(Utils.renderMarkdownSafe('hello world'), 'hello world');
});

const s2 = suite('computeVariance');
test(s2, '142% jump vs prior month flags', () => {
  const v = Utils.computeVariance([2100, 2400, 5800], 2, 20);
  assert(v.flagged, 'should flag');
  assert(Math.abs(v.deltaPrior - 1.4166666) < 0.01, 'deltaPrior ≈ 142%');
});
test(s2, '5% change does not flag at 20% threshold', () => {
  const v = Utils.computeVariance([1000, 1050], 1, 20);
  assert(!v.flagged, 'should not flag');
});
test(s2, 'first month never flags (no prior)', () => {
  const v = Utils.computeVariance([5000], 0, 20);
  assert(!v.flagged, 'first month no flag');
  assertEq(v.deltaPrior, null);
});
test(s2, 'flags when 3-mo avg delta exceeds even if prior is close', () => {
  const v = Utils.computeVariance([100, 100, 100, 130], 3, 20);
  assert(v.flagged, '+30% vs avg flags');
});
test(s2, 'zero prior month with non-zero current flags', () => {
  const v = Utils.computeVariance([0, 500], 1, 20);
  assert(v.flagged, 'going from 0 to 500 should flag');
});
test(s2, 'all zero values do not flag', () => {
  const v = Utils.computeVariance([0, 0, 0], 2, 20);
  assert(!v.flagged, 'no flag for all zero');
});
test(s2, '25% drop also flags (negative direction)', () => {
  const v = Utils.computeVariance([1000, 750], 1, 20);
  assert(v.flagged, '-25% should flag at 20% threshold');
  assert(v.deltaPrior < 0, 'deltaPrior is negative for a drop');
});
test(s2, 'sign flip from positive to negative flags', () => {
  const v = Utils.computeVariance([100, -100], 1, 20);
  assert(v.flagged, '+100 to -100 should flag');
});
test(s2, 'increasingly negative series flags on absolute basis', () => {
  // -100 to -150 = 50% worse, abs delta is 0.5
  const v = Utils.computeVariance([-100, -150], 1, 20);
  assert(v.flagged, '-100 to -150 should flag');
});
test(s2, 'NaN in 3-mo window does not poison the avg flag', () => {
  // One bad cell becomes 0 in the avg, so [NaN, 100, 100, 130] avg = (0+100+100)/3 ≈ 66.67,
  // delta = (130 - 66.67) / 66.67 ≈ 0.95 → flagged at 20%
  const v = Utils.computeVariance([NaN, 100, 100, 130], 3, 20);
  assert(v.flagged, 'NaN should be coerced to 0 in slice, not poison the avg');
});

const s3 = suite('Anomaly Rules');

// === runway_drop ===
test(s3, 'runway_drop fires when current 18 days less than prior', () => {
  const ctx = { snapshotMonth: '2026-04', cashRunwayDays: { current: 124, prior: 142 } };
  const a = Utils.anomalyRunwayDrop(ctx);
  assert(a, 'should return anomaly');
  assertEq(a.signature, 'runway_drop');
  assertEq(a.severity, 'critical');
  assert(a.title.includes('18'), 'title mentions 18 days');
});
test(s3, 'runway_drop returns null when drop < 10 days', () => {
  const a = Utils.anomalyRunwayDrop({ snapshotMonth: '2026-04', cashRunwayDays: { current: 138, prior: 142 } });
  assertEq(a, null);
});
test(s3, 'runway_drop returns null when prior is missing', () => {
  const a = Utils.anomalyRunwayDrop({ snapshotMonth: '2026-04', cashRunwayDays: { current: 100, prior: null } });
  assertEq(a, null);
});

// === category_spike ===
test(s3, 'category_spike picks the highest multiplier', () => {
  const ctx = {
    snapshotMonth: '2026-04',
    categories: [
      { id: 1, name: 'Office', recentMonths: [400, 410, 420, 400, 410, 410, 1840] },     // ~4.4x
      { id: 2, name: 'Saas',   recentMonths: [200, 200, 200, 200, 200, 200, 800] },       // 4x
      { id: 3, name: 'Stable', recentMonths: [100, 100, 100, 100, 100, 100, 100] }        // 1x
    ]
  };
  const a = Utils.anomalyCategorySpike(ctx);
  assert(a, 'should return anomaly');
  assertEq(a.target_id, 1);
  assert(a.title.includes('Office'), 'title names Office');
});
test(s3, 'category_spike returns null when nothing exceeds 3x', () => {
  const ctx = {
    snapshotMonth: '2026-04',
    categories: [{ id: 1, name: 'Steady', recentMonths: [100, 100, 100, 100, 100, 100, 200] }] // 2x
  };
  assertEq(Utils.anomalyCategorySpike(ctx), null);
});
test(s3, 'category_spike skips categories with zero history', () => {
  const ctx = {
    snapshotMonth: '2026-04',
    categories: [{ id: 1, name: 'New', recentMonths: [0, 0, 0, 0, 0, 0, 5000] }]
  };
  assertEq(Utils.anomalyCategorySpike(ctx), null);
});

// === ar_aging_trend ===
test(s3, 'ar_aging_trend fires when climbing 3 months', () => {
  const ctx = { snapshotMonth: '2026-04', arDaysOutstanding: { current: 41, prior: 33, twoMonthsAgo: 28, threeMonthsAgo: 24 } };
  const a = Utils.anomalyArAgingTrend(ctx);
  assert(a, 'should fire');
  assertEq(a.severity, 'critical');
});
test(s3, 'ar_aging_trend null when not strictly climbing', () => {
  const ctx = { snapshotMonth: '2026-04', arDaysOutstanding: { current: 41, prior: 33, twoMonthsAgo: 35, threeMonthsAgo: 24 } };
  assertEq(Utils.anomalyArAgingTrend(ctx), null);
});

// === profitability_flip ===
test(s3, 'profitability_flip positive when negative→positive', () => {
  const a = Utils.anomalyProfitabilityFlip({ snapshotMonth: '2026-04', netIncome: { current: 3200, prior: -800 } });
  assert(a, 'should fire');
  assertEq(a.severity, 'positive');
  assert(a.title.toLowerCase().includes('profitable'));
});
test(s3, 'profitability_flip critical when positive→negative', () => {
  const a = Utils.anomalyProfitabilityFlip({ snapshotMonth: '2026-04', netIncome: { current: -500, prior: 200 } });
  assert(a, 'should fire');
  assertEq(a.severity, 'critical');
});
test(s3, 'profitability_flip null when both same sign', () => {
  assertEq(Utils.anomalyProfitabilityFlip({ snapshotMonth: '2026-04', netIncome: { current: 100, prior: 200 } }), null);
});

// === dscr_breach ===
test(s3, 'dscr_breach fires on cross below 1.0', () => {
  const a = Utils.anomalyDscrBreach({ snapshotMonth: '2026-04', dscr: { current: 0.85, prior: 1.10 } });
  assert(a, 'should fire');
});
test(s3, 'dscr_breach null when both below 1.0 (already breached)', () => {
  assertEq(Utils.anomalyDscrBreach({ snapshotMonth: '2026-04', dscr: { current: 0.7, prior: 0.8 } }), null);
});
test(s3, 'dscr_breach null when both at/above 1.0', () => {
  assertEq(Utils.anomalyDscrBreach({ snapshotMonth: '2026-04', dscr: { current: 1.2, prior: 1.5 } }), null);
});

// === recurring_disappeared ===
test(s3, 'recurring_disappeared fires when 6 priors non-zero, current zero', () => {
  const ctx = {
    snapshotMonth: '2026-04',
    categories: [{ id: 5, name: 'Adobe Sub', recentMonths: [50, 50, 50, 50, 50, 50, 0] }]
  };
  const a = Utils.anomalyRecurringDisappeared(ctx);
  assert(a, 'should fire');
  assertEq(a.target_id, 5);
});
test(s3, 'recurring_disappeared null when any prior is zero', () => {
  const ctx = {
    snapshotMonth: '2026-04',
    categories: [{ id: 5, name: 'Sometimes', recentMonths: [50, 50, 0, 50, 50, 50, 0] }]
  };
  assertEq(Utils.anomalyRecurringDisappeared(ctx), null);
});
test(s3, 'recurring_disappeared null when current is non-zero', () => {
  const ctx = {
    snapshotMonth: '2026-04',
    categories: [{ id: 5, name: 'Active', recentMonths: [50, 50, 50, 50, 50, 50, 25] }]
  };
  assertEq(Utils.anomalyRecurringDisappeared(ctx), null);
});

// Display summary
document.getElementById('summary').textContent = `${passed} passed, ${failed} failed`;
document.getElementById('summary').style.background = failed === 0 ? '#d1fae5' : '#fee2e2';
</script>
</body>
</html>
