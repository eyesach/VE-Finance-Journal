<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manual VE Sales — Unit Tests</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; background: #f8f9fa; }
  .suite h2 { font-size: 1rem; border-bottom: 2px solid #4a90a4; padding-bottom: 4px; }
  .test { padding: 6px 12px; margin: 2px 0; border-radius: 4px; font-size: 0.85rem; }
  .test.pass { background: #d4edda; color: #155724; }
  .test.fail { background: #f8d7da; color: #721c24; }
  .summary { margin-top: 20px; padding: 16px; background: #fff; border-radius: 8px; font-weight: 600; }
  .error-detail { font-size: 0.78rem; font-family: monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Manual VE Sales — Unit Tests</h1>
<div id="results"></div>
<div id="summary" class="summary"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="../js/utils.js"></script>
<script>window.CompanyManager = {};</script>
<script src="../js/database.js"></script>

<script>
let passed = 0, failed = 0;
const resultsEl = document.getElementById('results');
function suite(name) {
  const div = document.createElement('div');
  div.className = 'suite';
  div.innerHTML = `<h2>${name}</h2>`;
  resultsEl.appendChild(div);
  return div;
}
function test(suiteEl, name, fn) {
  const div = document.createElement('div');
  div.className = 'test';
  try { fn(); div.className = 'test pass'; div.textContent = '✔ ' + name; passed++; }
  catch (e) { div.className = 'test fail'; div.innerHTML = '✘ ' + name + `<div class="error-detail">${e.message || e}</div>`; failed++; }
  suiteEl.appendChild(div);
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg) { if (a !== b) throw new Error((msg || 'Not equal') + `: got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`); }
function assertClose(a, b, eps, msg) { if (Math.abs(a - b) > (eps === undefined ? 0.005 : eps)) throw new Error((msg || 'Not close') + `: got ${a}, expected ${b}`); }

async function freshDb() {
  if (!Database.SQL) Database.SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
  Database.autoSave = () => {};
  Database.db = new Database.SQL.Database();
  Database.createSchema();
  return Database;
}
function rows(sql, params) {
  const r = Database.db.exec(sql, params || []);
  return r.length ? r[0].values : [];
}

// Seed: imported tradeshow T1, imported online O1, manual tradeshow MAN-0001 on event 5
function seedImportProtection(d) {
  d.db = new d.SQL.Database(); d.createSchema();
  d.db.run(`INSERT INTO ve_sales (transaction_no, date, subtotal, tax, total, source) VALUES ('T1','2026-11-06',10,0,10,'tradeshow')`);
  d.db.run(`INSERT INTO ve_sales (transaction_no, date, subtotal, tax, total, source) VALUES ('O1','2026-11-06',20,0,20,'online')`);
  d.db.run(`INSERT INTO ve_sales (transaction_no, date, subtotal, tax, total, source, event_id, is_manual) VALUES ('MAN-0001','2026-11-06',30,0,30,'tradeshow',5,1)`);
  d.db.run(`INSERT INTO ve_sale_items (transaction_no, name, price, quantity, amount, source) VALUES ('T1','A',10,1,10,'tradeshow')`);
  d.db.run(`INSERT INTO ve_sale_items (transaction_no, name, price, quantity, amount, source) VALUES ('O1','B',20,1,20,'online')`);
  d.db.run(`INSERT INTO ve_sale_items (transaction_no, name, price, quantity, amount, source) VALUES ('MAN-0001','C',30,1,30,'tradeshow')`);
}

(async () => {
  await freshDb();

  // ============== Task 1: Import protection ==============
  const s1 = suite('Import protection');
  test(s1, 'fresh schema has is_manual', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    const cols = rows('PRAGMA table_info(ve_sales)').map(r => r[1]);
    assert(cols.includes('is_manual'), 'columns: ' + cols.join(','));
  });
  test(s1, 'migration adds is_manual to old db', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    d.db.run('DROP TABLE ve_sales');
    d.db.run(`CREATE TABLE ve_sales (id INTEGER PRIMARY KEY AUTOINCREMENT, transaction_no TEXT NOT NULL, date DATE NOT NULL,
      billing_name TEXT, description TEXT, subtotal DECIMAL(10,2) DEFAULT 0, tax DECIMAL(10,2) DEFAULT 0,
      shipping DECIMAL(10,2) DEFAULT 0, discount DECIMAL(10,2) DEFAULT 0, total DECIMAL(10,2) DEFAULT 0,
      source TEXT NOT NULL DEFAULT 'online', event_id INTEGER, UNIQUE(transaction_no, source))`);
    d.migrateSchema();
    const cols = rows('PRAGMA table_info(ve_sales)').map(r => r[1]);
    assert(cols.includes('is_manual'), 'columns: ' + cols.join(','));
  });
  test(s1, "clearVESales('tradeshow') keeps manual tradeshow sales and items", () => {
    seedImportProtection(Database);
    Database.clearVESales('tradeshow');
    const tx = rows("SELECT transaction_no, event_id FROM ve_sales WHERE source = 'tradeshow'");
    assertEqual(JSON.stringify(tx.map(r => r[0])), JSON.stringify(['MAN-0001']));
    assertEqual(tx[0][1], 5, 'event_id kept');
    assertEqual(rows("SELECT COUNT(*) FROM ve_sale_items WHERE transaction_no = 'MAN-0001'")[0][0], 1);
    assertEqual(rows("SELECT COUNT(*) FROM ve_sale_items WHERE transaction_no = 'T1'")[0][0], 0);
  });
  test(s1, 'clearVESales() keeps manual sales', () => {
    seedImportProtection(Database);
    Database.clearVESales();
    assertEqual(JSON.stringify(rows('SELECT transaction_no FROM ve_sales').map(r => r[0])), JSON.stringify(['MAN-0001']));
    assertEqual(JSON.stringify(rows('SELECT name FROM ve_sale_items').map(r => r[0])), JSON.stringify(['C']));
  });
  test(s1, 'clearVESales(null, {includeManual:true}) removes everything', () => {
    seedImportProtection(Database);
    Database.clearVESales(null, { includeManual: true });
    assertEqual(rows('SELECT COUNT(*) FROM ve_sales')[0][0], 0);
    assertEqual(rows('SELECT COUNT(*) FROM ve_sale_items')[0][0], 0);
  });
  test(s1, 'getManualSaleCount', () => {
    seedImportProtection(Database);
    assertEqual(Database.getManualSaleCount(), 1);
  });

  // ============== Task 2: Manual sale maths ==============
  const s2 = suite('Manual sale maths');
  test(s2, 'sanitizeQty', () => {
    assertEqual(Utils.sanitizeQty(''), 0);
    assertEqual(Utils.sanitizeQty('-3'), 0);
    assertEqual(Utils.sanitizeQty('2.7'), 2);
    assertEqual(Utils.sanitizeQty('abc'), 0);
    assertEqual(Utils.sanitizeQty(5), 5);
  });
  test(s2, 'nextManualTxNo', () => {
    assertEqual(Utils.nextManualTxNo([]), 'MAN-0001');
    assertEqual(Utils.nextManualTxNo(['MAN-0002', 'T9', 'MAN-0010']), 'MAN-0011');
  });
  test(s2, 'pickProductLink: no mappings uses product', () => {
    const r = Utils.pickProductLink({ name: 'Small Fall', price: 309.99 }, []);
    assertEqual(r.name, 'Small Fall'); assertEqual(r.price, 309.99); assertEqual(r.linked, false);
  });
  test(s2, 'pickProductLink: one mapping', () => {
    const r = Utils.pickProductLink({ name: 'Small Fall', price: 309.99 }, [{ name: 'Small Fall Arrangement', price: 309.99 }]);
    assertEqual(r.name, 'Small Fall Arrangement'); assertEqual(r.linked, true);
  });
  test(s2, 'pickProductLink: prefers mapping matching product price', () => {
    const r = Utils.pickProductLink({ name: 'Small Fall', price: 309.99 },
      [{ name: 'SF old', price: 300 }, { name: 'SF new', price: 309.99 }]);
    assertEqual(r.name, 'SF new'); assertEqual(r.options.length, 2);
  });
  test(s2, 'pickProductLink: no price match falls back to first', () => {
    const r = Utils.pickProductLink({ name: 'Small Fall', price: 309.99 },
      [{ name: 'SF a', price: 1 }, { name: 'SF b', price: 2 }]);
    assertEqual(r.name, 'SF a');
  });
  test(s2, 'computeVESaleTotals matches receipt (309.99 @ 7.25%)', () => {
    const t = Utils.computeVESaleTotals([{ price: 309.99, quantity: 1, taxable: true }], 7.25);
    assertClose(t.subtotal, 309.99); assertClose(t.tax, 22.47); assertClose(t.total, 332.46);
  });
  test(s2, 'computeVESaleTotals: mixed taxable, shipping, discount', () => {
    const t = Utils.computeVESaleTotals([
      { price: 100, quantity: 1, taxable: true },
      { price: 50, quantity: 1, taxable: false },
    ], 10, { shipping: 5, discount: 20 });
    assertClose(t.subtotal, 150); assertClose(t.tax, 10); assertClose(t.total, 145);
    assertClose(t.items[1].amount, 50);
  });
  test(s2, 'buildManualSales: singles expand per unit, groups stay together', () => {
    const sales = Utils.buildManualSales({
      singles: [{ name: 'Large', price: 850, quantity: 2 }, { name: 'Medium', price: 410, quantity: 1 }],
      groups: [{ buyer: 'Booth 14', items: [{ name: 'Small', price: 309.99, quantity: 1 }, { name: 'Tulip', price: 95, quantity: 2 }] }],
      ratePct: 7.25, date: '2026-11-06', startTxNo: 'MAN-0001',
    });
    assertEqual(sales.length, 4);
    assertEqual(sales.map(s => s.transactionNo).join(','), 'MAN-0001,MAN-0002,MAN-0003,MAN-0004');
    assertEqual(sales[0].items.length, 1); assertEqual(sales[0].items[0].quantity, 1);
    assertClose(sales[0].total, 911.63);
    assertEqual(sales[3].billingName, 'Booth 14');
    assertEqual(sales[3].items.length, 2);
    assertClose(sales[3].subtotal, 499.99);
    assert(sales.every(s => s.items.every(i => i.taxable === true)), 'taxable when rate > 0');
    assertEqual(sales[0].date, '2026-11-06');
  });
  test(s2, 'buildManualSales: rate 0 means untaxed; empty groups dropped', () => {
    const sales = Utils.buildManualSales({
      singles: [{ name: 'A', price: 10, quantity: 1 }, { name: 'B', price: 5, quantity: 0 }],
      groups: [{ buyer: '', items: [{ name: 'C', price: 1, quantity: 0 }] }],
      ratePct: 0, date: '2026-11-06', startTxNo: 'MAN-0005',
    });
    assertEqual(sales.length, 1);
    assertEqual(sales[0].transactionNo, 'MAN-0005');
    assertEqual(sales[0].items[0].taxable, false);
    assertClose(sales[0].tax, 0);
  });

  // ============== Task 3: Manual sale persistence ==============
  const s3 = suite('Manual sale persistence');
  const built = () => Utils.buildManualSales({
    singles: [{ name: 'Small Fall', price: 309.99, quantity: 2 }], groups: [],
    ratePct: 7.25, date: '2026-11-06', startTxNo: 'MAN-0001',
  });
  const fresh = () => { const d = Database; d.db = new d.SQL.Database(); d.createSchema(); return d; };
  const addEvent = (type) => Database.createVEEvent({ name: 'E', type, start_date: '2026-11-06', end_date: '2026-11-06' });

  test(s3, 'insertManualSales stores flag, event, source, items', () => {
    fresh();
    const nos = Database.insertManualSales(built(), { eventId: 3, source: 'tradeshow' });
    assertEqual(nos.join(','), 'MAN-0001,MAN-0002');
    const r = rows("SELECT is_manual, event_id, description, total FROM ve_sales ORDER BY transaction_no");
    assertEqual(r.length, 2);
    assert(r.every(x => x[0] === 1 && x[1] === 3 && x[2] === 'Manual entry'), JSON.stringify(r));
    assertClose(r[0][3], 332.46);
    const it = Database.getAllVESaleItems().get('MAN-0001');
    assertEqual(it.length, 1); assertEqual(it[0].source, 'tradeshow'); assertClose(it[0].amount, 309.99);
  });
  test(s3, 'getAllVETxNos', () => {
    fresh(); Database.insertManualSales(built(), { eventId: null, source: 'tradeshow' });
    assertEqual(Database.getAllVETxNos().sort().join(','), 'MAN-0001,MAN-0002');
  });
  test(s3, 'getEventSaleSource: imported online sales win over manual tradeshow', () => {
    fresh(); const e = addEvent('tradeshow');
    Database.db.run(`INSERT INTO ve_sales (transaction_no, date, source, event_id) VALUES ('O1','2026-11-06','online',?)`, [e]);
    Database.insertManualSales(built().slice(0, 1), { eventId: e, source: 'tradeshow' });
    assertEqual(Database.getEventSaleSource(e), 'online');
  });
  test(s3, 'getEventSaleSource: empty event uses type; null → tradeshow', () => {
    fresh();
    assertEqual(Database.getEventSaleSource(addEvent('online_event')), 'online');
    assertEqual(Database.getEventSaleSource(addEvent('tradeshow')), 'tradeshow');
    assertEqual(Database.getEventSaleSource(null), 'tradeshow');
  });
  const editSale = (over) => Object.assign({ transactionNo: 'MAN-0001', date: '2026-11-07', billingName: 'Booth', subtotal: 405, tax: 29.36,
    shipping: 0, discount: 0, total: 434.36, source: 'tradeshow', eventId: 3 }, over || {});
  const editItems = [{ name: 'Small Fall', price: 309.99, quantity: 1, taxable: true, amount: 309.99 },
                     { name: 'Tulip', price: 95, quantity: 1, taxable: true, amount: 95 }];
  test(s3, 'updateVESale changes items and totals, keeps is_manual', () => {
    fresh(); Database.insertManualSales(built(), { eventId: 3, source: 'tradeshow' });
    Database.updateVESale('MAN-0001', 'tradeshow', editSale(), editItems);
    const r = rows("SELECT total, billing_name, date, is_manual, description FROM ve_sales WHERE transaction_no='MAN-0001'")[0];
    assertClose(r[0], 434.36); assertEqual(r[1], 'Booth'); assertEqual(r[2], '2026-11-07'); assertEqual(r[3], 1); assertEqual(r[4], 'Manual entry');
    assertEqual(Database.getAllVESaleItems().get('MAN-0001').length, 2);
    assertEqual(Database.getAllVESaleItems().get('MAN-0002').length, 1, 'other sale untouched');
  });
  test(s3, 'updateVESale re-keys source on sale and items', () => {
    fresh(); Database.insertManualSales(built(), { eventId: 3, source: 'tradeshow' });
    Database.updateVESale('MAN-0001', 'tradeshow', editSale({ source: 'online' }), editItems);
    assertEqual(rows("SELECT source FROM ve_sales WHERE transaction_no='MAN-0001'")[0][0], 'online');
    assert(Database.getAllVESaleItems().get('MAN-0001').every(i => i.source === 'online'));
  });
  test(s3, 'updateVESale can unassign event', () => {
    fresh(); Database.insertManualSales(built(), { eventId: 3, source: 'tradeshow' });
    Database.updateVESale('MAN-0001', 'tradeshow', editSale({ eventId: null }), editItems);
    assertEqual(rows("SELECT event_id FROM ve_sales WHERE transaction_no='MAN-0001'")[0][0], null);
  });
  test(s3, 'same tx number in both sources: delete/update touch only one', () => {
    fresh();
    Database.db.run(`INSERT INTO ve_sales (transaction_no, date, total, source) VALUES ('X1','2026-11-06',1,'online')`);
    Database.db.run(`INSERT INTO ve_sales (transaction_no, date, total, source) VALUES ('X1','2026-11-06',2,'tradeshow')`);
    Database.db.run(`INSERT INTO ve_sale_items (transaction_no, name, price, quantity, amount, source) VALUES ('X1','On',1,1,1,'online')`);
    Database.db.run(`INSERT INTO ve_sale_items (transaction_no, name, price, quantity, amount, source) VALUES ('X1','Ts',2,1,2,'tradeshow')`);
    Database.updateVESale('X1', 'online', editSale({ transactionNo: 'X1', source: 'online', total: 9 }),
      [{ name: 'On2', price: 9, quantity: 1, taxable: false, amount: 9 }]);
    assertEqual(rows("SELECT total FROM ve_sales WHERE transaction_no='X1' AND source='tradeshow'")[0][0], 2);
    assertEqual(rows("SELECT name FROM ve_sale_items WHERE source='tradeshow'")[0][0], 'Ts');
    Database.deleteVESale('X1', 'tradeshow');
    assertEqual(rows("SELECT source FROM ve_sales").map(r => r[0]).join(','), 'online');
    assertEqual(rows("SELECT name FROM ve_sale_items").map(r => r[0]).join(','), 'On2');
  });
  test(s3, 'deleteVESale removes legacy untagged items only when no other source shares the number', () => {
    fresh();
    Database.db.run(`INSERT INTO ve_sales (transaction_no, date, source) VALUES ('L1','2026-11-06','online')`);
    Database.db.run(`INSERT INTO ve_sale_items (transaction_no, name, price, quantity, amount) VALUES ('L1','Old',1,1,1)`);
    Database.deleteVESale('L1', 'online');
    assertEqual(rows('SELECT COUNT(*) FROM ve_sale_items')[0][0], 0);
  });
  test(s3, 'ensureProductLink twice → one mapping; analytics counts manual units', () => {
    fresh();
    Database.db.run(`INSERT INTO products (name, price) VALUES ('Small Fall', 309.99)`);
    const pid = rows('SELECT id FROM products')[0][0];
    Database.ensureProductLink(pid, 'Small Fall', 309.99);
    Database.ensureProductLink(pid, 'Small Fall', 309.99);
    assertEqual(rows('SELECT COUNT(*) FROM product_ve_mappings')[0][0], 1);
    Database.insertManualSales(built(), { eventId: null, source: 'tradeshow' });
    const a = Database.getLinkedProductAnalytics(null, null, 'all');
    const p = a.byProduct.find(x => x.product_id === pid || x.id === pid);
    assert(p, 'product in analytics: ' + JSON.stringify(a.byProduct));
    assertEqual(p.units_sold, 2);
  });
  test(s3, 'manual sale survives a re-import end to end', () => {
    fresh(); Database.insertManualSales(built(), { eventId: 7, source: 'tradeshow' });
    Database.clearVESales('tradeshow');
    Database.upsertVESales([{ transactionNo: 'T1', date: '2026-11-06', total: 5, source: 'tradeshow' }]);
    assertEqual(rows("SELECT transaction_no FROM ve_sales ORDER BY transaction_no").map(r => r[0]).join(','), 'MAN-0001,MAN-0002,T1');
    assertEqual(rows("SELECT event_id FROM ve_sales WHERE transaction_no='MAN-0001'")[0][0], 7);
  });

  document.getElementById('summary').textContent = `${passed}/${passed + failed} tests passed, ${failed} failed`;
})().catch(e => { document.getElementById('summary').textContent = 'CRASH: ' + e.message; });
</script>
</body>
</html>
