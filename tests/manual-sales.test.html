<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manual VE Sales — Unit Tests</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; background: #f8f9fa; }
  .suite h2 { font-size: 1rem; border-bottom: 2px solid #4a90a4; padding-bottom: 4px; }
  .test { padding: 6px 12px; margin: 2px 0; border-radius: 4px; font-size: 0.85rem; }
  .test.pass { background: #d4edda; color: #155724; }
  .test.fail { background: #f8d7da; color: #721c24; }
  .summary { margin-top: 20px; padding: 16px; background: #fff; border-radius: 8px; font-weight: 600; }
  .error-detail { font-size: 0.78rem; font-family: monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Manual VE Sales — Unit Tests</h1>
<div id="results"></div>
<div id="summary" class="summary"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script src="../js/utils.js"></script>
<script>window.CompanyManager = {};</script>
<script src="../js/database.js"></script>

<script>
let passed = 0, failed = 0;
const resultsEl = document.getElementById('results');
function suite(name) {
  const div = document.createElement('div');
  div.className = 'suite';
  div.innerHTML = `<h2>${name}</h2>`;
  resultsEl.appendChild(div);
  return div;
}
function test(suiteEl, name, fn) {
  const div = document.createElement('div');
  div.className = 'test';
  try { fn(); div.className = 'test pass'; div.textContent = '✔ ' + name; passed++; }
  catch (e) { div.className = 'test fail'; div.innerHTML = '✘ ' + name + `<div class="error-detail">${e.message || e}</div>`; failed++; }
  suiteEl.appendChild(div);
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg) { if (a !== b) throw new Error((msg || 'Not equal') + `: got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`); }
function assertClose(a, b, eps, msg) { if (Math.abs(a - b) > (eps === undefined ? 0.005 : eps)) throw new Error((msg || 'Not close') + `: got ${a}, expected ${b}`); }

async function freshDb() {
  if (!Database.SQL) Database.SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
  Database.autoSave = () => {};
  Database.db = new Database.SQL.Database();
  Database.createSchema();
  return Database;
}
function rows(sql, params) {
  const r = Database.db.exec(sql, params || []);
  return r.length ? r[0].values : [];
}

// Seed: imported tradeshow T1, imported online O1, manual tradeshow MAN-0001 on event 5
function seedImportProtection(d) {
  d.db = new d.SQL.Database(); d.createSchema();
  d.db.run(`INSERT INTO ve_sales (transaction_no, date, subtotal, tax, total, source) VALUES ('T1','2026-11-06',10,0,10,'tradeshow')`);
  d.db.run(`INSERT INTO ve_sales (transaction_no, date, subtotal, tax, total, source) VALUES ('O1','2026-11-06',20,0,20,'online')`);
  d.db.run(`INSERT INTO ve_sales (transaction_no, date, subtotal, tax, total, source, event_id, is_manual) VALUES ('MAN-0001','2026-11-06',30,0,30,'tradeshow',5,1)`);
  d.db.run(`INSERT INTO ve_sale_items (transaction_no, name, price, quantity, amount, source) VALUES ('T1','A',10,1,10,'tradeshow')`);
  d.db.run(`INSERT INTO ve_sale_items (transaction_no, name, price, quantity, amount, source) VALUES ('O1','B',20,1,20,'online')`);
  d.db.run(`INSERT INTO ve_sale_items (transaction_no, name, price, quantity, amount, source) VALUES ('MAN-0001','C',30,1,30,'tradeshow')`);
}

(async () => {
  await freshDb();

  // ============== Task 1: Import protection ==============
  const s1 = suite('Import protection');
  test(s1, 'fresh schema has is_manual', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    const cols = rows('PRAGMA table_info(ve_sales)').map(r => r[1]);
    assert(cols.includes('is_manual'), 'columns: ' + cols.join(','));
  });
  test(s1, 'migration adds is_manual to old db', () => {
    const d = Database; d.db = new d.SQL.Database(); d.createSchema();
    d.db.run('DROP TABLE ve_sales');
    d.db.run(`CREATE TABLE ve_sales (id INTEGER PRIMARY KEY AUTOINCREMENT, transaction_no TEXT NOT NULL, date DATE NOT NULL,
      billing_name TEXT, description TEXT, subtotal DECIMAL(10,2) DEFAULT 0, tax DECIMAL(10,2) DEFAULT 0,
      shipping DECIMAL(10,2) DEFAULT 0, discount DECIMAL(10,2) DEFAULT 0, total DECIMAL(10,2) DEFAULT 0,
      source TEXT NOT NULL DEFAULT 'online', event_id INTEGER, UNIQUE(transaction_no, source))`);
    d.migrateSchema();
    const cols = rows('PRAGMA table_info(ve_sales)').map(r => r[1]);
    assert(cols.includes('is_manual'), 'columns: ' + cols.join(','));
  });
  test(s1, "clearVESales('tradeshow') keeps manual tradeshow sales and items", () => {
    seedImportProtection(Database);
    Database.clearVESales('tradeshow');
    const tx = rows("SELECT transaction_no, event_id FROM ve_sales WHERE source = 'tradeshow'");
    assertEqual(JSON.stringify(tx.map(r => r[0])), JSON.stringify(['MAN-0001']));
    assertEqual(tx[0][1], 5, 'event_id kept');
    assertEqual(rows("SELECT COUNT(*) FROM ve_sale_items WHERE transaction_no = 'MAN-0001'")[0][0], 1);
    assertEqual(rows("SELECT COUNT(*) FROM ve_sale_items WHERE transaction_no = 'T1'")[0][0], 0);
  });
  test(s1, 'clearVESales() keeps manual sales', () => {
    seedImportProtection(Database);
    Database.clearVESales();
    assertEqual(JSON.stringify(rows('SELECT transaction_no FROM ve_sales').map(r => r[0])), JSON.stringify(['MAN-0001']));
    assertEqual(JSON.stringify(rows('SELECT name FROM ve_sale_items').map(r => r[0])), JSON.stringify(['C']));
  });
  test(s1, 'clearVESales(null, {includeManual:true}) removes everything', () => {
    seedImportProtection(Database);
    Database.clearVESales(null, { includeManual: true });
    assertEqual(rows('SELECT COUNT(*) FROM ve_sales')[0][0], 0);
    assertEqual(rows('SELECT COUNT(*) FROM ve_sale_items')[0][0], 0);
  });
  test(s1, 'getManualSaleCount', () => {
    seedImportProtection(Database);
    assertEqual(Database.getManualSaleCount(), 1);
  });

  document.getElementById('summary').textContent = `${passed}/${passed + failed} tests passed, ${failed} failed`;
})().catch(e => { document.getElementById('summary').textContent = 'CRASH: ' + e.message; });
</script>
</body>
</html>
